# Sample workflow for building and deploying an Astro site to GitHub Pages
#
# To get started with Astro see: https://docs.astro.build/en/getting-started/
#
name: Deploy Astro site to Pages

on:
  # Production work only runs when the built site can change. CI/workflow/docs-only merges use manual/other checks instead.
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

  # Allows exact-branch validation without publishing a feature branch.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full reviewed commit SHA for this branch (prevents testing a moved ref)
        required: true
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

env:
  BUILD_PATH: "." # default value when not using subfolders
  # BUILD_PATH: subfolder
  # PUBLIC_OSA_PUBLICATION_DATE: source of truth for structured data
  # datePublished in HomePage.astro. Update when CVPR 2026 acceptance
  # date is confirmed; placeholder '2026-06-01' is used as fallback.
  PUBLIC_OSA_PUBLICATION_DATE: "2026-06-01"

jobs:
  build:
    name: Build
    # Playwright 1.60 does not support Ubuntu 26.04 yet; ubuntu-latest now rolls to 26.04.
    # Keep the E2E gate on a supported runner until a tested Playwright upgrade.
    runs-on: ubuntu-24.04
    steps:
      # Supply-chain hardening (Round 15 P2): pin to commit SHA instead of @v6
      # mutable tag. Auto-update via Dependabot: .github/dependabot.yml.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Verify the selected source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$actual_sha" == "$EXPECTED_SHA" ]] || { echo 'Selected ref moved or expected_sha is invalid'; exit 1; }
          fi
          mkdir -p test-results/standards
          printf '{"sha":"%s","ref":"%s","run":"%s"}\n' "$actual_sha" "$GITHUB_REF" "$GITHUB_RUN_ID" > test-results/standards/source.json
      # OSA uses npm (per package-lock.json in repo). Use the standard
      # Astro Pages template npm detection — earlier I assumed pnpm
      # based on a stale pnpm.onlyBuiltDependencies key that was
      # removed; the project actually uses npm.
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "lockfile=yarn.lock" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "lockfile=package-lock.json" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ${{ env.BUILD_PATH }}/${{ steps.detect-package-manager.outputs.lockfile }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
        working-directory: ${{ env.BUILD_PATH }}
      # P1 fix: catch production-only dependency regressions (undici, vite, etc.)
      # before they ship. `npm audit --omit=dev` skips devDependencies so transient
      # build-time issues don't block deploys. Fails the build on high/critical vulns.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ env.BUILD_PATH }}
        continue-on-error: false
      - name: Test standards guard and date precision
        run: npm run test:standards
        working-directory: ${{ env.BUILD_PATH }}
      - name: Build with Astro
        run: npm run build
        working-directory: ${{ env.BUILD_PATH }}
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-two-engines-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
        working-directory: ${{ env.BUILD_PATH }}

      - name: Install browser system libraries
        run: npx playwright install-deps chromium webkit
        working-directory: ${{ env.BUILD_PATH }}
      - name: Run E2E tests
        run: npx playwright test
        working-directory: ${{ env.BUILD_PATH }}
      - name: Upload exact-source browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osa-standards-${{ github.sha }}
          path: test-results
          retention-days: 3
          if-no-files-found: warn
      - name: Verify hreflang base dedupe (§2.7)
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const findHtml = (dir) => {
            const r = [];
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) r.push(...findHtml(p));
              else if (e.name.endsWith('.html')) r.push(p);
            }
            return r;
          };
          const BASE = 'osa';
          const broken = [];
          for (const f of findHtml('dist')) {
            const c = fs.readFileSync(f, 'utf-8');
            const re = /<link rel=\"alternate\" hreflang=\"[^\"]*\" href=\"([^\"]+)\"/g;
            let m;
            while ((m = re.exec(c)) !== null) {
              const url = m[1];
              const hits = (url.match(new RegExp(BASE, 'g')) || []).length;
              if (hits > 1) broken.push(\`\${f}: \${url} has \${BASE} \${hits} times\`);
            }
          }
          if (broken.length) { console.log(broken.join('\n')); process.exit(1); }
          console.log('OK: no hreflang base duplication');
          "
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    # Serialize only the real Pages deployment. Build/test work must not wait behind provider deployment latency.
    concurrency:
      group: pages
      cancel-in-progress: false
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
